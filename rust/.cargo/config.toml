# Static Linux builds from any host, with no C toolchain: musl's libc and
# start-up files ship with the Rust target, and rust-lld ships with rustup.
#   rustup target add x86_64-unknown-linux-musl
#   cargo build --release --target x86_64-unknown-linux-musl
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
