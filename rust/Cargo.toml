[package]
name = "eureka-daemon"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "A drop-in Rust build of the Eureka Protocol daemon: one binary, no Python."
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "eureka-daemon"
path = "src/main.rs"

[features]
# HTTPS for webhook wake-ups, inside the binary. `ring` compiles some C, so a default build needs a
# C compiler. `--no-default-features` is pure Rust: no C compiler, and no HTTPS webhooks.
default = ["tls"]
tls = ["dep:tokio-rustls", "dep:webpki-roots"]

# Every dependency but the optional two is pure Rust.
[dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "io-util"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Declarations only, no C: access lists for the identity key, Windows' equivalent of mode 0600.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
