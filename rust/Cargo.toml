[package]
name = "eureka-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A drop-in Rust build of the Eureka Protocol daemon: one binary, no Python."
license = "MIT"
publish = false

[[bin]]
name = "eureka-daemon"
path = "src/main.rs"

[dependencies]
# Every dependency is pure Rust, so the Linux build links statically against musl
# with no C toolchain.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "io-util"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
